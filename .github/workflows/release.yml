name: Release

# Creates a DRAFT release for the version in Cargo.toml. The owner publishes it
# (which creates the tag). Nothing happens if the release or tag already exists.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Release builds start only after the full CI matrix passes. ci.yml also runs on its own push
  # trigger for main, so CI runs twice, but only for a merge that builds a release.
  ci:
    needs: check
    if: needs.check.outputs.create == 'true'
    uses: ./.github/workflows/ci.yml

  check:
    runs-on: ubuntu-22.04
    outputs:
      create: ${{ steps.v.outputs.create }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          # `gh release view` finds releases by tag, and a draft has none yet; list includes drafts.
          releases=$(gh release list --limit 200 --json tagName,name)
          found=$(jq --arg t "v$version" '[.[] | select(.tagName == $t or .name == "adiutor-pdf " + $t)] | length' <<< "$releases")
          tags=$(git ls-remote --tags origin "v$version")
          create=false
          if [ "$found" = 0 ] && [ -z "$tags" ]; then
            create=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "create=$create" >> "$GITHUB_OUTPUT"

  # Third-party notices shared by all packages: Rust crate licenses (cargo-about) and egui's font licenses.
  notices:
    needs: check
    if: needs.check.outputs.create == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Generate notices
        run: |
          cargo install --locked cargo-about --version 0.9.3 --features cli
          mkdir -p notices/fonts
          bash scripts/third-party-licenses.sh notices/THIRD-PARTY-LICENSES.html
          crate=$(cargo metadata --locked --format-version 1 |
            jq -er '.packages[] | select(.name == "epaint_default_fonts") | .manifest_path')
          fonts="$(dirname "$crate")/fonts"
          cp "$fonts/OFL.txt" "$fonts/UFL.txt" "$fonts/Hack-Regular.txt" \
            "$fonts/emoji-icon-font-mit-license.txt" "$fonts/egui-icons.txt" notices/fonts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notices
          path: notices/
          if-no-files-found: error

  windows:
    needs: [check, ci, notices]
    if: needs.check.outputs.create == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notices
          path: notices
      - name: Build
        shell: bash
        run: |
          cargo build --release
          bash scripts/fetch-pdfium.sh win-x64 pdfium
          pkg="adiutor-pdf-v$VERSION-windows-x64"
          mkdir -p "$pkg/licenses/pdfium"
          cp target/release/adiutor-pdf.exe pdfium/bin/pdfium.dll LICENSE-MIT LICENSE-APACHE "$pkg/"
          cp pdfium/LICENSE pdfium/licenses/* "$pkg/licenses/pdfium/"
          cp -R notices/. "$pkg/licenses/"
      # Puts dumpbin on PATH.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Check the exe needs no VC++ runtime
        shell: pwsh
        run: |
          # .cargo/config.toml links the CRT statically; fail if the exe still imports it.
          $deps = dumpbin /dependents target\release\adiutor-pdf.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed" }
          $deps
          if ($deps -match 'VCRUNTIME|MSVCP') { throw "adiutor-pdf.exe depends on the VC++ runtime" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "adiutor-pdf-v$env:VERSION-windows-x64\*" -DestinationPath "adiutor-pdf-v$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: adiutor-pdf-v${{ needs.check.outputs.version }}-windows-x64.zip

  macos:
    needs: [check, ci, notices]
    if: needs.check.outputs.create == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notices
          path: notices
      - name: Build universal app
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          bash scripts/fetch-pdfium.sh mac-x64 pdfium-x64
          bash scripts/fetch-pdfium.sh mac-arm64 pdfium-arm64
          app=adiutor-pdf.app/Contents
          mkdir -p "$app/MacOS" "$app/Frameworks" licenses/pdfium
          lipo -create -output "$app/MacOS/adiutor-pdf" \
            target/x86_64-apple-darwin/release/adiutor-pdf target/aarch64-apple-darwin/release/adiutor-pdf
          lipo -create -output "$app/Frameworks/libpdfium.dylib" \
            pdfium-x64/lib/libpdfium.dylib pdfium-arm64/lib/libpdfium.dylib
          lipo -info "$app/MacOS/adiutor-pdf" "$app/Frameworks/libpdfium.dylib" | tee lipo.txt
          [ "$(grep -c 'x86_64 arm64' lipo.txt)" = 2 ]
          cp packaging/macos/Info.plist "$app/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$app/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$app/Info.plist"
          # Only the arm64 notices are shipped; fail if the x64 ones ever differ.
          diff -r pdfium-x64/licenses pdfium-arm64/licenses
          cmp pdfium-x64/LICENSE pdfium-arm64/LICENSE
          cp pdfium-arm64/LICENSE pdfium-arm64/licenses/* licenses/pdfium/
          cp -R notices/. licenses/
          # Ad-hoc signature so Apple Silicon allows launching the app.
          codesign --force --deep -s - adiutor-pdf.app
          pkg="adiutor-pdf-v$VERSION-macos-universal"
          mkdir "$pkg"
          cp -R adiutor-pdf.app licenses LICENSE-MIT LICENSE-APACHE "$pkg/"
          ditto -c -k --keepParent "$pkg" "$pkg.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: adiutor-pdf-v${{ needs.check.outputs.version }}-macos-universal.zip

  linux:
    needs: [check, ci, notices]
    if: needs.check.outputs.create == 'true'
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notices
          path: notices
      - name: Install Linux dev packages
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Build tar.gz
        run: |
          cargo build --release
          bash scripts/fetch-pdfium.sh linux-x64 pdfium
          pkg="adiutor-pdf-v$VERSION-linux-x86_64"
          mkdir -p "$pkg/licenses/pdfium"
          cp target/release/adiutor-pdf pdfium/lib/libpdfium.so packaging/linux/adiutor-pdf.desktop \
            packaging/linux/adiutor-pdf.png LICENSE-MIT LICENSE-APACHE README.md "$pkg/"
          cp pdfium/LICENSE pdfium/licenses/* "$pkg/licenses/pdfium/"
          cp -R notices/. "$pkg/licenses/"
          # LGPL-2.1 material (Linux only): winit's Wayland backend uses wayland-protocols-plasma.
          lgpl="$pkg/licenses/lgpl"
          mkdir -p "$lgpl/plasma-wayland-protocols"
          cp packaging/licenses/LGPL-2.1.txt packaging/licenses/NOTICE.txt "$lgpl/"
          plasma=$(cargo metadata --locked --format-version 1 |
            jq -er '.packages[] | select(.name == "wayland-protocols-plasma") | "\(.version) \(.manifest_path)"')
          # NOTICE.txt lists the LGPL files of this exact version.
          if [ "${plasma%% *}" != 0.3.12 ]; then
            echo "wayland-protocols-plasma is ${plasma%% *}: update packaging/licenses/NOTICE.txt" >&2
            exit 1
          fi
          src="$(dirname "${plasma#* }")/plasma-wayland-protocols"
          [ "$(find "$src" -name '*.xml' | wc -l)" -gt 0 ]
          find "$src" -name '*.xml' -exec cp {} "$lgpl/plasma-wayland-protocols/" \;
          cp -R "$src/LICENSES" "$lgpl/plasma-wayland-protocols/"
          tar --owner=0 --group=0 -czf "$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: adiutor-pdf-v${{ needs.check.outputs.version }}-linux-x86_64.tar.gz

  release:
    needs: [check, ci, windows, macos, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          GH_REPO: ${{ github.repository }}
        # dist also holds the notices artifact; attach only the packages.
        run: |
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "adiutor-pdf v$VERSION" --generate-notes dist/adiutor-pdf-*
