name: CI

on: [push, pull_request, workflow_call]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            lib_dir: pdfium/lib
          - os: windows-latest
            platform: win-x64
            lib_dir: pdfium/bin
          - os: macos-latest
            platform: mac-arm64
            lib_dir: pdfium/lib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Linux dev packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Fetch PDFium
        shell: bash
        run: bash scripts/fetch-pdfium.sh ${{ matrix.platform }} pdfium
      - name: Point tests at PDFium
        shell: bash
        run: echo "ADIUTOR_PDFIUM_DIR=${{ github.workspace }}/${{ matrix.lib_dir }}" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Fails when a dependency's license is not accepted in about.toml or a clarified copyright line is
      # missing (scripts/third-party-licenses.sh). The about.toml targets cover all
      # platforms, so one OS is enough; rust-cache keeps the installed cargo-about.
      - name: Check third-party licenses
        if: runner.os == 'Linux'
        run: |
          cargo install --locked cargo-about --version 0.9.3 --features cli
          bash scripts/third-party-licenses.sh "$RUNNER_TEMP/THIRD-PARTY-LICENSES.html"
