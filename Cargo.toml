[package]
name = "adiutor-pdf"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sidussoftware/adiutor-pdf"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "default_fonts", "wayland", "x11"] }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_8125", "thread_safe"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
toml = "1.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Same winit as eframe; only for EventLoopBuilderExtMacOS::with_default_menu.
winit = { version = "0.30.13", default-features = false }
# Quit from the Dock / logout as a `quit` Apple event (src/macos.rs). Pinned exactly: the 0.1.0
# source was reviewed; review the diff before bumping. objc2 crates: same versions as Cargo.lock.
fmv-macos-events = "=0.1.0"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
