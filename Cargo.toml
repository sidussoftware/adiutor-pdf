[package]
name = "adiutor-pdf"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sidussoftware/adiutor-pdf"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "default_fonts", "wayland", "x11"] }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_8125", "thread_safe"] }
rfd = "0.18"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Same winit as eframe; only for EventLoopBuilderExtMacOS::with_default_menu.
winit = { version = "0.30.13", default-features = false }

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
